<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
html,body,iframe{margin:0;width:100%;height:100%;border:0;background:#02060d;overflow:hidden}
</style>
</head>
<body>
<iframe id="app" src="../outputs/anatomix-v2.html" allow="camera; microphone"></iframe>
<script>
const frame = document.getElementById('app');
frame.addEventListener('load', () => {
  setTimeout(() => {
    try {
      frame.contentWindow.document.getElementById('initBtn').click();
    } catch (_) {}
  }, 1200);
});
</script>
</body>
</html>
