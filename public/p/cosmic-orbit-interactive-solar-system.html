<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cosmic Orbit — Interactive Solar System</title>
<style>
/* ============================================================
   COSMIC ORBIT — a living solar system
   Everything scales with `vmin` so the scene fits any screen,
   desktop or mobile, without media-query gymnastics.
   ============================================================ */

:root {
  /* Palette: deep-space indigo, warm solar golds, cool planet glows */
  --space-deep:   #05060f;
  --space-nebula: #10122b;
  --sun-core:     #fff7d6;
  --sun-mid:      #ffcf5c;
  --sun-edge:     #ff8a2b;
  --ring-line:    rgba(140, 160, 255, 0.14);
}

* { margin: 0; padding: 0; box-sizing: border-box; }

html, body { height: 100%; overflow: hidden; }

/* ---------- 1. THE COSMIC BACKGROUND ----------
   Layered radial gradients fake distant nebulae;
   stars are injected by JavaScript for natural randomness. */
body {
  background:
    radial-gradient(ellipse 80% 60% at 70% 20%, rgba(88, 60, 160, 0.18), transparent 60%),
    radial-gradient(ellipse 70% 55% at 20% 80%, rgba(30, 90, 150, 0.16), transparent 60%),
    radial-gradient(ellipse 120% 100% at 50% 50%, var(--space-nebula), var(--space-deep) 75%);
  font-family: "Segoe UI", system-ui, sans-serif;
  display: grid;
  place-items: center;
}

/* The square stage everything orbits inside — sized to the viewport */
.universe {
  position: relative;
  width: 100vmin;
  height: 100vmin;
}

/* ---------- 2. STARS ----------
   Each .star is positioned randomly by JS.
   The twinkle animation varies per-star via CSS custom props. */
.star {
  position: fixed;               /* stars fill the whole screen, not just the stage */
  border-radius: 50%;
  background: #fff;
  opacity: var(--base-opacity, 0.8);
  animation: twinkle var(--twinkle-time, 3s) ease-in-out infinite alternate;
  animation-delay: var(--twinkle-delay, 0s);
}

@keyframes twinkle {
  from { opacity: var(--base-opacity); transform: scale(1); }
  to   { opacity: 0.15;               transform: scale(0.7); }
}

/* ---------- 3. SHOOTING STARS ----------
   A thin streak that flies diagonally across the sky.
   JS re-launches them at random intervals & positions. */
.shooting-star {
  position: fixed;
  width: 26vmin;
  height: 2px;
  background: linear-gradient(90deg, rgba(255,255,255,0.95), transparent);
  border-radius: 999px;
  filter: drop-shadow(0 0 6px rgba(200, 220, 255, 0.9));
  transform: rotate(-35deg);
  animation: shoot 1.1s ease-out forwards;
  pointer-events: none;
}

@keyframes shoot {
  from { opacity: 1; translate: 0 0; }
  to   { opacity: 0; translate: -60vmin 42vmin; }
}

/* ---------- 4. THE SUN ----------
   Layered box-shadows create the corona; a slow pulse
   makes the light feel alive rather than static. */
.sun {
  position: absolute;
  top: 50%; left: 50%;
  width: 11vmin; height: 11vmin;
  transform: translate(-50%, -50%);
  border-radius: 50%;
  background: radial-gradient(circle at 35% 35%, var(--sun-core) 0%, var(--sun-mid) 45%, var(--sun-edge) 100%);
  box-shadow:
    0 0 3vmin  1vmin  rgba(255, 210, 110, 0.9),
    0 0 8vmin  3vmin  rgba(255, 160, 60, 0.45),
    0 0 18vmin 6vmin  rgba(255, 120, 40, 0.22),
    0 0 34vmin 10vmin rgba(255, 100, 40, 0.10);
  animation: sun-breathe 5s ease-in-out infinite alternate;
  z-index: 5;
}

@keyframes sun-breathe {
  from { box-shadow:
           0 0 3vmin  1vmin  rgba(255, 210, 110, 0.9),
           0 0 8vmin  3vmin  rgba(255, 160, 60, 0.45),
           0 0 18vmin 6vmin  rgba(255, 120, 40, 0.22),
           0 0 34vmin 10vmin rgba(255, 100, 40, 0.10); }
  to   { box-shadow:
           0 0 4vmin  1.5vmin rgba(255, 220, 130, 1.0),
           0 0 10vmin 4vmin   rgba(255, 170, 70, 0.55),
           0 0 22vmin 7vmin   rgba(255, 130, 50, 0.28),
           0 0 40vmin 12vmin  rgba(255, 110, 45, 0.14); }
}

/* ---------- 5. ORBIT RINGS ----------
   Faint circular guides. --orbit sets diameter per planet. */
.orbit {
  position: absolute;
  top: 50%; left: 50%;
  width: var(--orbit);
  height: var(--orbit);
  margin-top: calc(var(--orbit) / -2);   /* center on the sun */
  margin-left: calc(var(--orbit) / -2);
  border: 1px solid var(--ring-line);
  border-radius: 50%;
  /* The whole ring rotates — carrying its planet with it */
  animation: revolve var(--period) linear infinite;
}

@keyframes revolve { to { transform: rotate(360deg); } }

/* ---------- 6. PLANETS ----------
   Each planet sits on the top edge of its rotating ring.
   A counter-rotation keeps its lighting/shine upright. */
.planet {
  position: absolute;
  top: 0; left: 50%;
  width: var(--size);
  height: var(--size);
  margin-top: calc(var(--size) / -2);
  margin-left: calc(var(--size) / -2);
  border-radius: 50%;
  background: var(--surface);
  box-shadow:
    inset -0.6vmin -0.6vmin 1.2vmin rgba(0, 0, 0, 0.55),  /* night side */
    0 0 1.6vmin var(--glow),                                /* atmospheric glow */
    0 0 4vmin  var(--glow-soft);
  animation: revolve var(--period) linear infinite reverse; /* keep face upright */
  cursor: pointer;
  transition: filter 0.3s ease;
}
.planet:hover { filter: brightness(1.4) saturate(1.3); }

/* Saturn-style ring around a planet (pure CSS, tilted ellipse) */
.planet-ring {
  position: absolute;
  top: 50%; left: 50%;
  width: 200%; height: 200%;
  transform: translate(-50%, -50%) rotateX(72deg);
  border-radius: 50%;
  border: 0.45vmin solid rgba(230, 200, 150, 0.55);
  box-shadow: 0 0 1vmin rgba(230, 200, 150, 0.35);
  pointer-events: none;
}

/* ---------- 7. MOON ----------
   A tiny satellite on its own mini-orbit around one planet. */
.moon-orbit {
  position: absolute;
  top: 50%; left: 50%;
  width: 240%; height: 240%;
  margin: -120% 0 0 -120%;
  animation: revolve 4s linear infinite;
}
.moon {
  position: absolute;
  top: 0; left: 50%;
  width: 0.9vmin; height: 0.9vmin;
  margin: -0.45vmin 0 0 -0.45vmin;
  border-radius: 50%;
  background: radial-gradient(circle at 35% 35%, #f0f0f5, #9aa0b5);
  box-shadow: 0 0 0.8vmin rgba(220, 225, 255, 0.7);
}

/* ---------- 8. ASTEROID BELT ----------
   A rotating container; JS scatters small rocks around it. */
.asteroid-belt {
  position: absolute;
  top: 50%; left: 50%;
  width: 62vmin; height: 62vmin;
  margin: -31vmin 0 0 -31vmin;
  animation: revolve 140s linear infinite;
  pointer-events: none;
}
.asteroid {
  position: absolute;
  border-radius: 50%;
  background: #8d8577;
  opacity: 0.75;
}

/* ---------- 9. PLANET LABEL (tap/hover tooltip) ---------- */
#label {
  position: fixed;
  bottom: 4vmin;
  left: 50%;
  transform: translateX(-50%);
  padding: 1vmin 2.4vmin;
  color: #cfd6ff;
  font-size: clamp(12px, 2vmin, 16px);
  letter-spacing: 0.14em;
  text-transform: uppercase;
  background: rgba(15, 18, 45, 0.55);
  border: 1px solid rgba(140, 160, 255, 0.25);
  border-radius: 999px;
  backdrop-filter: blur(6px);
  opacity: 0;
  transition: opacity 0.35s ease;
  pointer-events: none;
  white-space: nowrap;
}
#label.visible { opacity: 1; }

/* ---------- 10. ACCESSIBILITY: reduced motion ---------- */
@media (prefers-reduced-motion: reduce) {
  .orbit, .planet, .moon-orbit, .asteroid-belt { animation-duration: 600s; }
  .star, .sun { animation: none; }
}
</style>
</head>
<body>

<div class="universe" id="universe">
  <!-- The glowing star at the heart of the system -->
  <div class="sun" data-name="The Sun — a G-type star"></div>

  <!-- Asteroid belt (rocks injected by JS) -->
  <div class="asteroid-belt" id="belt"></div>

  <!--
    Each orbit ring carries one planet.
    Custom properties drive everything:
      --orbit  : ring diameter
      --period : time for one full revolution
      --size   : planet diameter
      --surface: planet gradient   --glow / --glow-soft : shine colors
  -->
  <div class="orbit" style="--orbit: 20vmin; --period: 8s;">
    <div class="planet" data-name="Mercury — swift &amp; scorched"
         style="--size: 1.6vmin;
                --surface: radial-gradient(circle at 35% 35%, #d8cfc4, #8a7f72);
                --glow: rgba(220,210,190,0.5); --glow-soft: rgba(220,210,190,0.15);"></div>
  </div>

  <div class="orbit" style="--orbit: 28vmin; --period: 13s;">
    <div class="planet" data-name="Venus — veiled in golden clouds"
         style="--size: 2.4vmin;
                --surface: radial-gradient(circle at 35% 35%, #ffe9b8, #d9a441);
                --glow: rgba(255,215,140,0.6); --glow-soft: rgba(255,215,140,0.18);"></div>
  </div>

  <div class="orbit" style="--orbit: 38vmin; --period: 20s;">
    <div class="planet" data-name="Earth — the pale blue dot"
         style="--size: 2.6vmin;
                --surface: radial-gradient(circle at 35% 35%, #8fd0ff, #1d5fd0 60%, #123a80);
                --glow: rgba(120,190,255,0.7); --glow-soft: rgba(120,190,255,0.2);">
      <!-- The Moon rides its own tiny orbit around Earth -->
      <div class="moon-orbit"><div class="moon"></div></div>
    </div>
  </div>

  <div class="orbit" style="--orbit: 48vmin; --period: 30s;">
    <div class="planet" data-name="Mars — the rust-red wanderer"
         style="--size: 2vmin;
                --surface: radial-gradient(circle at 35% 35%, #ff9a6b, #c1440e);
                --glow: rgba(255,120,70,0.6); --glow-soft: rgba(255,120,70,0.18);"></div>
  </div>

  <div class="orbit" style="--orbit: 76vmin; --period: 48s;">
    <div class="planet" data-name="Jupiter — king of storms"
         style="--size: 5vmin;
                --surface: radial-gradient(circle at 35% 35%, #f5dcb8, #c8956a 55%, #9c6b4a);
                --glow: rgba(240,200,150,0.55); --glow-soft: rgba(240,200,150,0.16);"></div>
  </div>

  <div class="orbit" style="--orbit: 92vmin; --period: 68s;">
    <div class="planet" data-name="Saturn — crowned with ice rings"
         style="--size: 4.2vmin;
                --surface: radial-gradient(circle at 35% 35%, #f7e7c3, #d4b06a);
                --glow: rgba(235,210,160,0.55); --glow-soft: rgba(235,210,160,0.16);">
      <div class="planet-ring"></div>
    </div>
  </div>
</div>

<!-- Tooltip shown when a planet is hovered or tapped -->
<div id="label"></div>

<script>
/* ============================================================
   JAVASCRIPT — the parts that need randomness or interaction
   ============================================================ */

/* ---------- Star field ----------
   Generate ~180 stars with random size, position, brightness
   and twinkle timing, so no two skies are identical. */
const STAR_COUNT = 180;
for (let i = 0; i < STAR_COUNT; i++) {
  const s = document.createElement('div');
  s.className = 'star';
  const size = Math.random() * 2.2 + 0.6;            // 0.6–2.8 px
  s.style.width  = size + 'px';
  s.style.height = size + 'px';
  s.style.left = Math.random() * 100 + 'vw';
  s.style.top  = Math.random() * 100 + 'vh';
  s.style.setProperty('--base-opacity', (Math.random() * 0.6 + 0.35).toFixed(2));
  s.style.setProperty('--twinkle-time', (Math.random() * 4 + 1.5).toFixed(2) + 's');
  s.style.setProperty('--twinkle-delay', (Math.random() * 5).toFixed(2) + 's');
  document.body.appendChild(s);
}

/* ---------- Asteroid belt ----------
   Scatter small rocks in a ring band between Mars and Jupiter.
   The parent container's CSS rotation carries them all around. */
const belt = document.getElementById('belt');
const ASTEROIDS = 110;
for (let i = 0; i < ASTEROIDS; i++) {
  const a = document.createElement('div');
  a.className = 'asteroid';
  const angle  = Math.random() * Math.PI * 2;        // random position on circle
  const radius = 29 + Math.random() * 4;             // band width in vmin
  const size   = Math.random() * 0.45 + 0.12;        // rock size in vmin
  a.style.width  = size + 'vmin';
  a.style.height = size + 'vmin';
  a.style.left = (31 + radius * Math.cos(angle)) + 'vmin'; // 31 = belt half-size
  a.style.top  = (31 + radius * Math.sin(angle)) + 'vmin';
  belt.appendChild(a);
}

/* ---------- Shooting stars ----------
   Every few seconds, launch a streak from a random point in the
   upper half of the sky. The CSS animation handles the flight;
   we just remove the element when it finishes. */
function launchShootingStar() {
  const streak = document.createElement('div');
  streak.className = 'shooting-star';
  streak.style.left = (30 + Math.random() * 65) + 'vw';
  streak.style.top  = (Math.random() * 40) + 'vh';
  document.body.appendChild(streak);
  streak.addEventListener('animationend', () => streak.remove());
  // schedule the next one at a random interval (2.5–8 s)
  setTimeout(launchShootingStar, 2500 + Math.random() * 5500);
}
setTimeout(launchShootingStar, 2000);

/* ---------- Interactivity: planet labels ----------
   Hover (desktop) or tap (mobile) a planet or the sun
   to reveal its name in the bottom tooltip. */
const label = document.getElementById('label');
let hideTimer = null;

function showLabel(text) {
  label.textContent = text;
  label.classList.add('visible');
  clearTimeout(hideTimer);
  hideTimer = setTimeout(() => label.classList.remove('visible'), 2600);
}

document.querySelectorAll('.planet, .sun').forEach(body => {
  body.addEventListener('mouseenter', () => showLabel(body.dataset.name));
  body.addEventListener('click',      () => showLabel(body.dataset.name));
});
</script>
</body>
</html>
