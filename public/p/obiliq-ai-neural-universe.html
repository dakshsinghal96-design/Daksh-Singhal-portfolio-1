<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OBILIQ AI — Neural Universe</title>

<!-- Futuristic display + UI typefaces -->
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
/* ================================================================
   OBILIQ AI — NEURAL UNIVERSE HERO
   ----------------------------------------------------------------
   Layer stack (back → front):
   1. <canvas>  starfield + drifting particles + faint mesh lines
   2. fog / haze divs behind the brain
   3. <svg>     the neural map (brain, branches, nodes, pills)
   4. HTML      navbar, hero heading, CTA buttons, vignette
   The neural map is GENERATED BY JAVASCRIPT from a data array,
   so nodes / pills / branches stay clean and easy to edit.
   ================================================================ */

:root {
  --bg-deep:    #04050e;
  --bg-indigo:  #0a0d24;
  --ink:        #eef2ff;
  --ink-dim:    #8b93b8;
  --core-cyan:  #4de1ff;
  --core-violet:#8b5cf6;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

html, body { height: 100%; }

body {
  font-family: "Rajdhani", system-ui, sans-serif;
  color: var(--ink);
  background:
    radial-gradient(ellipse 90% 70% at 50% 38%, rgba(70, 60, 160, 0.20), transparent 65%),
    radial-gradient(ellipse 70% 60% at 15% 85%, rgba(20, 90, 140, 0.18), transparent 60%),
    radial-gradient(ellipse 70% 60% at 85% 85%, rgba(120, 40, 140, 0.14), transparent 60%),
    linear-gradient(180deg, var(--bg-indigo), var(--bg-deep) 70%);
  overflow: hidden;
}

.hero { position: relative; width: 100vw; height: 100vh; }

/* ---------- BACKGROUND CANVAS (stars / particles / mesh) ---------- */
#space {
  position: absolute; inset: 0;
  width: 100%; height: 100%;
  transition: transform 0.4s ease-out;   /* smoothed parallax */
}

/* ---------- ENERGY HAZE behind the brain ---------- */
.fog {
  position: absolute;
  left: 50%; top: 50%;
  width: 90vmin; height: 70vmin;
  transform: translate(-50%, -52%);
  background:
    radial-gradient(ellipse at 50% 50%, rgba(77, 225, 255, 0.14), transparent 55%),
    radial-gradient(ellipse at 42% 60%, rgba(139, 92, 246, 0.16), transparent 60%);
  filter: blur(30px);
  animation: fog-drift 9s ease-in-out infinite alternate;
  pointer-events: none;
}
@keyframes fog-drift {
  from { transform: translate(-50%, -52%) scale(1);    opacity: 0.85; }
  to   { transform: translate(-49%, -54%) scale(1.08); opacity: 1;    }
}

/* ---------- VIGNETTE for cinematic depth ---------- */
.vignette {
  position: absolute; inset: 0;
  background: radial-gradient(ellipse 120% 100% at 50% 45%, transparent 55%, rgba(2, 3, 10, 0.75) 100%);
  pointer-events: none;
  z-index: 6;
}

/* ================= NAVBAR ================= */
.nav {
  position: absolute; top: 0; left: 0; right: 0;
  z-index: 10;
  display: flex; align-items: center; justify-content: space-between;
  padding: 16px 42px;
  background: linear-gradient(180deg, rgba(10, 13, 36, 0.65), rgba(10, 13, 36, 0.25));
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  border-bottom: 1px solid rgba(120, 140, 255, 0.12);
}

.brand { display: flex; align-items: center; gap: 12px; }
.brand svg { filter: drop-shadow(0 0 8px rgba(77, 225, 255, 0.8)); }
.brand-name {
  font-family: "Orbitron", sans-serif;
  font-weight: 700; font-size: 17px; letter-spacing: 0.28em;
  background: linear-gradient(90deg, #d8f6ff, var(--core-cyan) 60%, var(--core-violet));
  -webkit-background-clip: text; background-clip: text; color: transparent;
}

.nav-links { display: flex; gap: 34px; list-style: none; }
.nav-links a {
  color: var(--ink-dim); text-decoration: none;
  font-size: 15px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase;
  transition: color 0.25s, text-shadow 0.25s;
}
.nav-links a:hover { color: #fff; text-shadow: 0 0 12px rgba(77, 225, 255, 0.9); }

.launch-btn {
  font-family: "Rajdhani", sans-serif;
  font-size: 14px; font-weight: 700; letter-spacing: 0.18em; text-transform: uppercase;
  color: #dffaff;
  padding: 10px 24px;
  background: rgba(77, 225, 255, 0.06);
  border: 1px solid rgba(77, 225, 255, 0.55);
  border-radius: 999px;
  cursor: pointer;
  box-shadow: 0 0 14px rgba(77, 225, 255, 0.25), inset 0 0 10px rgba(77, 225, 255, 0.08);
  transition: box-shadow 0.3s, transform 0.3s, background 0.3s;
}
.launch-btn:hover {
  background: rgba(77, 225, 255, 0.14);
  box-shadow: 0 0 26px rgba(77, 225, 255, 0.55), inset 0 0 14px rgba(77, 225, 255, 0.18);
  transform: translateY(-1px);
}

/* ================= NEURAL MAP (SVG) ================= */
#neural {
  position: absolute; inset: 0;
  width: 100%; height: 100%;
  z-index: 4;
  transition: transform 0.35s ease-out;   /* smoothed parallax */
}

/* --- branches: dashes flow outward like energy --- */
.branch {
  fill: none;
  stroke-linecap: round;
  stroke-dasharray: 5 9;
  animation: flow 1.4s linear infinite;
}
@keyframes flow { to { stroke-dashoffset: -14; } }
.branch-soft { fill: none; stroke-linecap: round; opacity: 0.22; }

/* --- orbit-like rotating ellipses around the brain --- */
.orbit-ring { transform-box: fill-box; transform-origin: center; animation: spin 70s linear infinite; }
.orbit-ring.reverse { animation-direction: reverse; animation-duration: 95s; }
@keyframes spin { to { transform: rotate(360deg); } }

/* --- brain pulse & shimmer --- */
.brain-body {
  transform-box: fill-box; transform-origin: center;
  animation: brain-pulse 4.5s ease-in-out infinite alternate;
}
@keyframes brain-pulse {
  from { transform: scale(1);    filter: brightness(1); }
  to   { transform: scale(1.03); filter: brightness(1.35); }
}
.synapse { stroke-dasharray: 6 10; animation: flow 1.1s linear infinite; }

/* --- core node heartbeat --- */
.core-glow { transform-box: fill-box; transform-origin: center; animation: core-beat 3s ease-in-out infinite alternate; }
@keyframes core-beat {
  from { transform: scale(1);    opacity: 0.75; }
  to   { transform: scale(1.18); opacity: 1;    }
}

/* --- category node breathing halo (delay staggered inline) --- */
.halo { transform-box: fill-box; transform-origin: center; animation: breathe 3.6s ease-in-out infinite alternate; }
@keyframes breathe {
  from { transform: scale(0.9); opacity: 0.5; }
  to   { transform: scale(1.15); opacity: 1;  }
}

/* --- hover states (SVG groups) --- */
.node-hit { cursor: pointer; }
.node-inner { transform-box: fill-box; transform-origin: center; transition: transform 0.3s ease, filter 0.3s ease; }
.node-hit:hover .node-inner { transform: scale(1.1); filter: brightness(1.5); }

.pill { cursor: pointer; }
.pill rect { transition: filter 0.3s ease; }
.pill:hover rect { filter: brightness(1.7); }
.pill-float { animation: floaty 6s ease-in-out infinite alternate; }
@keyframes floaty { from { transform: translateY(0); } to { transform: translateY(-6px); } }

/* ================= HERO TEXT & CTAs ================= */
.hero-copy {
  position: absolute;
  left: 50%; bottom: 4.5vh;
  transform: translateX(-50%);
  text-align: center;
  z-index: 8;
  width: min(92vw, 900px);
}

.hero-title {
  font-family: "Orbitron", sans-serif;
  font-weight: 900;
  font-size: clamp(34px, 6vw, 72px);
  letter-spacing: 0.22em;
  background: linear-gradient(90deg, #bfefff 5%, var(--core-cyan) 40%, var(--core-violet) 75%, #ff8a3d);
  -webkit-background-clip: text; background-clip: text; color: transparent;
  filter:
    drop-shadow(0 0 18px rgba(77, 225, 255, 0.55))
    drop-shadow(0 0 46px rgba(139, 92, 246, 0.35));
  animation: title-glow 4s ease-in-out infinite alternate;
}
@keyframes title-glow {
  from { filter: drop-shadow(0 0 14px rgba(77,225,255,0.4))  drop-shadow(0 0 38px rgba(139,92,246,0.25)); }
  to   { filter: drop-shadow(0 0 24px rgba(77,225,255,0.75)) drop-shadow(0 0 60px rgba(139,92,246,0.45)); }
}

.hero-sub {
  margin-top: 10px;
  font-size: clamp(15px, 2vw, 21px);
  font-weight: 500;
  letter-spacing: 0.22em;
  color: var(--ink-dim);
  text-transform: uppercase;
}

.cta-row { margin-top: 26px; display: flex; gap: 22px; justify-content: center; flex-wrap: wrap; }

.cta {
  font-family: "Rajdhani", sans-serif;
  font-size: 16px; font-weight: 700;
  letter-spacing: 0.2em; text-transform: uppercase;
  padding: 14px 38px;
  border-radius: 999px;
  cursor: pointer;
  transition: transform 0.3s ease, box-shadow 0.3s ease, background 0.3s ease;
}
.cta:hover { transform: translateY(-2px) scale(1.04); }

.cta-primary {
  color: #04121a;
  background: linear-gradient(90deg, var(--core-cyan), #7ab8ff);
  border: none;
  box-shadow: 0 0 24px rgba(77, 225, 255, 0.5), 0 0 60px rgba(77, 225, 255, 0.2);
}
.cta-primary:hover { box-shadow: 0 0 36px rgba(77, 225, 255, 0.85), 0 0 90px rgba(77, 225, 255, 0.35); }

.cta-ghost {
  color: #e6d8ff;
  background: rgba(139, 92, 246, 0.07);
  border: 1px solid rgba(160, 120, 255, 0.6);
  box-shadow: 0 0 16px rgba(139, 92, 246, 0.3), inset 0 0 12px rgba(139, 92, 246, 0.1);
}
.cta-ghost:hover { box-shadow: 0 0 30px rgba(139, 92, 246, 0.6), inset 0 0 16px rgba(139, 92, 246, 0.2); }

/* ================= RESPONSIVE ================= */
@media (max-width: 1100px) {
  .nav-links { display: none; }              /* keep nav minimal on tablets */
}
@media (max-width: 820px) {
  .pill, .pill-link { display: none; }       /* declutter: hide sub-project pills */
  .nav { padding: 14px 20px; }
  .hero-copy { bottom: 3vh; }
}
@media (max-width: 520px) {
  .brand-name { font-size: 14px; letter-spacing: 0.2em; }
  .launch-btn { padding: 8px 16px; font-size: 12px; }
  .cta { padding: 12px 26px; font-size: 14px; }
}

/* Respect users who prefer minimal motion */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.001s !important; animation-iteration-count: 1 !important; }
}
</style>
</head>
<body>

<div class="hero">

  <!-- Layer 1: starfield / particle mesh -->
  <canvas id="space"></canvas>

  <!-- Layer 2: energy haze behind the brain -->
  <div class="fog"></div>

  <!-- Layer 3: the neural map — populated entirely by JavaScript -->
  <svg id="neural" viewBox="0 0 1700 1000" preserveAspectRatio="xMidYMid meet" aria-label="OBILIQ AI neural project map"></svg>

  <!-- Layer 4: UI chrome -->
  <nav class="nav">
    <div class="brand">
      <!-- tiny neural logo mark -->
      <svg width="26" height="26" viewBox="0 0 26 26" fill="none">
        <circle cx="13" cy="13" r="4" fill="#4de1ff"/>
        <circle cx="4"  cy="6"  r="2" fill="#8b5cf6"/>
        <circle cx="22" cy="6"  r="2" fill="#8b5cf6"/>
        <circle cx="4"  cy="21" r="2" fill="#8b5cf6"/>
        <circle cx="22" cy="21" r="2" fill="#8b5cf6"/>
        <path d="M13 13L4 6M13 13l9-7M13 13l-9 8m9-8 9 8" stroke="#4de1ff" stroke-width="1" opacity="0.7"/>
      </svg>
      <span class="brand-name">OBILIQ&nbsp;AI</span>
    </div>
    <ul class="nav-links">
      <li><a href="#">Home</a></li>
      <li><a href="#">Projects</a></li>
      <li><a href="#">Categories</a></li>
      <li><a href="#">About</a></li>
      <li><a href="#">Developers</a></li>
      <li><a href="#">Contact</a></li>
    </ul>
    <button class="launch-btn">Launch App</button>
  </nav>

  <div class="hero-copy">
    <h1 class="hero-title">OBILIQ&nbsp;AI</h1>
    <p class="hero-sub">1000+ AI Projects Connected in One Neural Universe</p>
    <div class="cta-row">
      <button class="cta cta-primary">Explore Projects</button>
      <button class="cta cta-ghost">Build With Us</button>
    </div>
  </div>

  <div class="vignette"></div>
</div>

<script>
/* ================================================================
   PART A — DATA
   One entry per category. Everything else (branches, nodes,
   pills, connectors, flow particles) is generated from this.
   ================================================================ */
const CORE = { x: 850, y: 470 };   // brain / core position in the 1700×1000 viewBox

const CATEGORIES = [
  { name: ["RESEARCH"],            count: 168, color: "#4da6ff", x: 400,  y: 195, side: "left",
    projects: [
      ["🧠", "NeuroInsight", "Brain Mapping AI"],
      ["⚛️", "QuantumMind",  "Theoretical AI"],
      ["📄", "PaperPilot",   "AI Research Copilot"],
    ]},
  { name: ["PRODUCTIVITY"],        count: 142, color: "#2dd4a8", x: 335,  y: 470, side: "left",
    projects: [
      ["⚙️", "FlowGen",   "AI Workflow Builder"],
      ["✅", "TaskForge", "Smart Task Automation"],
      ["📝", "NoteGen",   "AI Note Assistant"],
    ]},
  { name: ["DEVELOPMENT"],         count: 236, color: "#a855f7", x: 400,  y: 745, side: "left",
    projects: [
      ["⌨️", "CodeWeaver", "AI Code Generator"],
      ["🐞", "BugSage",    "AI Debug Assistant"],
      ["🔌", "APIGen",     "AI API Builder"],
    ]},
  { name: ["EDUCATION"],           count: 118, color: "#22d3ee", x: 1300, y: 195, side: "right",
    projects: [
      ["🎓", "TutorMind", "AI Tutor"],
      ["📚", "LearnGen",  "Personalized Learning"],
      ["❓", "QuizForge", "AI Quiz Generator"],
    ]},
  { name: ["DATA &", "ANALYTICS"], count: 154, color: "#f5b942", x: 1365, y: 470, side: "right",
    projects: [
      ["🧬", "DataSynth",  "Synthetic Data AI"],
      ["📊", "InsightHub", "AI Analytics"],
      ["📈", "ChartMind",  "Smart Data Viz"],
    ]},
  { name: ["CREATIVE AI"],         count: 187, color: "#ff8a3d", x: 1300, y: 745, side: "right",
    projects: [
      ["🎨", "Artisan AI",  "AI Image Studio"],
      ["🎵", "MuseFlow",    "AI Music Composer"],
      ["🎬", "ScriptMind",  "AI Story & Script"],
    ]},
  { name: ["BUSINESS"],            count: 131, color: "#ff5e5e", x: 850,  y: 150, side: "top",
    projects: [
      ["💼", "BizPilot",    "AI Business Assistant"],
      ["🔭", "MarketLens",  "AI Market Intelligence"],
      ["🖋️", "ProposalAI",  "AI Proposal Generator"],
    ]},
];

/* ================================================================
   PART B — SVG BUILD HELPERS
   ================================================================ */
const SVG_NS = "http://www.w3.org/2000/svg";
const svg = document.getElementById("neural");

function el(tag, attrs = {}, parent = svg) {
  const node = document.createElementNS(SVG_NS, tag);
  for (const [k, v] of Object.entries(attrs)) node.setAttribute(k, v);
  parent.appendChild(node);
  return node;
}

/* ---------- defs: gradients & glow filters (shared) ---------- */
const defs = el("defs");

// generic soft glow (Gaussian blur stacked under source)
const glow = el("filter", { id: "glow", x: "-60%", y: "-60%", width: "220%", height: "220%" }, defs);
el("feGaussianBlur", { stdDeviation: "6", result: "b" }, glow);
const glowMerge = el("feMerge", {}, glow);
el("feMergeNode", { in: "b" }, glowMerge);
el("feMergeNode", { in: "SourceGraphic" }, glowMerge);

// stronger glow for the brain + core
const glowBig = el("filter", { id: "glow-big", x: "-80%", y: "-80%", width: "260%", height: "260%" }, defs);
el("feGaussianBlur", { stdDeviation: "14", result: "b" }, glowBig);
const gbMerge = el("feMerge", {}, glowBig);
el("feMergeNode", { in: "b" }, gbMerge);
el("feMergeNode", { in: "SourceGraphic" }, gbMerge);

// brain fill gradient
const brainGrad = el("radialGradient", { id: "brain-fill", cx: "45%", cy: "40%", r: "75%" }, defs);
el("stop", { offset: "0%",  "stop-color": "#2b2f6e" }, brainGrad);
el("stop", { offset: "55%", "stop-color": "#181b46" }, brainGrad);
el("stop", { offset: "100%","stop-color": "#0c0e2c" }, brainGrad);

// brain stroke gradient (cyan → violet)
const brainStroke = el("linearGradient", { id: "brain-stroke", x1: "0%", y1: "0%", x2: "100%", y2: "100%" }, defs);
el("stop", { offset: "0%",   "stop-color": "#4de1ff" }, brainStroke);
el("stop", { offset: "100%", "stop-color": "#8b5cf6" }, brainStroke);

// core fill
const coreGrad = el("radialGradient", { id: "core-fill", cx: "40%", cy: "35%", r: "80%" }, defs);
el("stop", { offset: "0%",   "stop-color": "#9ef1ff" }, coreGrad);
el("stop", { offset: "45%",  "stop-color": "#3fb9ea" }, coreGrad);
el("stop", { offset: "100%", "stop-color": "#5b3df0" }, coreGrad);

/* ================================================================
   PART C — ORBIT RINGS + BRAIN + CORE (drawn back-to-front)
   ================================================================ */

// --- faint orbit-like ellipses circling the brain ---
const orbits = el("g", { opacity: "0.5" });
el("ellipse", { class: "orbit-ring", cx: CORE.x, cy: CORE.y, rx: 300, ry: 105,
  fill: "none", stroke: "rgba(120,150,255,0.28)", "stroke-width": 1, "stroke-dasharray": "2 10" }, orbits);
el("ellipse", { class: "orbit-ring reverse", cx: CORE.x, cy: CORE.y, rx: 235, ry: 165,
  fill: "none", stroke: "rgba(150,110,255,0.22)", "stroke-width": 1, "stroke-dasharray": "2 12" }, orbits);

/* ================================================================
   PART D — BRANCHES + NODES + PILLS (generated per category)
   ================================================================ */
const branchesLayer = el("g");   // branches under nodes
const nodesLayer    = el("g");   // nodes + pills above branches

CATEGORIES.forEach((cat, i) => {
  /* ---------- D1. organic bezier branch from core to node ---------- */
  const dx = cat.x - CORE.x, dy = cat.y - CORE.y;
  const len = Math.hypot(dx, dy);
  const nx = -dy / len, ny = dx / len;                 // perpendicular unit vector
  const bend = len * 0.16 * (i % 2 ? 1 : -1);          // alternate curve direction

  const p1x = CORE.x + dx * 0.33 + nx * bend,        p1y = CORE.y + dy * 0.33 + ny * bend;
  const p2x = CORE.x + dx * 0.66 - nx * bend * 0.55, p2y = CORE.y + dy * 0.66 - ny * bend * 0.55;
  // stop the branch at the node's edge (radius 52)
  const ex = cat.x - (dx / len) * 52, ey = cat.y - (dy / len) * 52;
  const d = `M ${CORE.x} ${CORE.y} C ${p1x} ${p1y}, ${p2x} ${p2y}, ${ex} ${ey}`;

  // soft under-glow stroke, twin faint filaments, then the animated main line
  el("path", { d, class: "branch-soft", stroke: cat.color, "stroke-width": 7, filter: "url(#glow)" }, branchesLayer);
  el("path", { d: `M ${CORE.x} ${CORE.y} C ${p1x + nx*22} ${p1y + ny*22}, ${p2x + nx*14} ${p2y + ny*14}, ${ex} ${ey}`,
    class: "branch-soft", stroke: cat.color, "stroke-width": 1.4 }, branchesLayer);
  el("path", { d: `M ${CORE.x} ${CORE.y} C ${p1x - nx*20} ${p1y - ny*20}, ${p2x - nx*12} ${p2y - ny*12}, ${ex} ${ey}`,
    class: "branch-soft", stroke: cat.color, "stroke-width": 1.4 }, branchesLayer);
  const main = el("path", { id: `branch-${i}`, d, class: "branch",
    stroke: cat.color, "stroke-width": 2.4, opacity: 0.85 }, branchesLayer);
  main.style.animationDuration = (1.1 + i * 0.12) + "s";

  /* ---------- D2. energy sparks travelling along the branch (SMIL) ---------- */
  [0, 1.6].forEach((delay, k) => {
    const spark = el("circle", { r: k ? 2.6 : 3.6, fill: k ? cat.color : "#ffffff",
      filter: "url(#glow)", opacity: 0.95 }, branchesLayer);
    const motion = el("animateMotion", { dur: (2.8 + i * 0.25) + "s", begin: delay + "s",
      repeatCount: "indefinite" }, spark);
    const mpath = document.createElementNS(SVG_NS, "mpath");
    mpath.setAttribute("href", `#branch-${i}`);
    mpath.setAttributeNS("http://www.w3.org/1999/xlink", "xlink:href", `#branch-${i}`);
    motion.appendChild(mpath);
  });

  /* ---------- D3. category node ---------- */
  const hit = el("g", { class: "node-hit" }, nodesLayer);

  // breathing halo
  const halo = el("circle", { class: "halo", cx: cat.x, cy: cat.y, r: 66,
    fill: cat.color, opacity: 0.5, filter: "url(#glow-big)" }, hit);
  halo.style.animationDelay = (i * 0.45) + "s";
  halo.setAttribute("fill-opacity", "0.28");

  const inner = el("g", { class: "node-inner" }, hit);
  el("circle", { cx: cat.x, cy: cat.y, r: 52, fill: "none",
    stroke: cat.color, "stroke-width": 1.6, filter: "url(#glow)" }, inner);            // neon ring
  el("circle", { cx: cat.x, cy: cat.y, r: 52, fill: "none",
    stroke: cat.color, "stroke-width": 0.6, opacity: 0.5, "stroke-dasharray": "3 6" }, inner);
  el("circle", { cx: cat.x, cy: cat.y, r: 44, fill: "rgba(8,10,30,0.88)",
    stroke: "rgba(255,255,255,0.12)", "stroke-width": 1 }, inner);                     // dark disc

  // project count
  const count = el("text", { x: cat.x, y: cat.y - 4, "text-anchor": "middle",
    fill: cat.color, "font-family": "Orbitron, sans-serif", "font-size": 20,
    "font-weight": 700, filter: "url(#glow)" }, inner);
  count.textContent = cat.count;

  // category name (supports 2 lines)
  cat.name.forEach((line, li) => {
    const t = el("text", { x: cat.x, y: cat.y + 14 + li * 12, "text-anchor": "middle",
      fill: "#dfe6ff", "font-family": "Rajdhani, sans-serif", "font-size": 10.5,
      "font-weight": 700, "letter-spacing": 1.5 }, inner);
    t.textContent = line;
  });

  /* ---------- D4. sub-project pills + connector lines ---------- */
  const PW = 192, PH = 46, GAP = 15;
  cat.projects.forEach((proj, p) => {
    let px, py, ax, ay;                       // pill origin + node anchor point
    if (cat.side === "left") {
      px = cat.x - 60 - 42 - PW;
      py = cat.y - (PH * 1.5 + GAP) + p * (PH + GAP);
      ax = cat.x - 52; ay = cat.y;
    } else if (cat.side === "right") {
      px = cat.x + 60 + 42;
      py = cat.y - (PH * 1.5 + GAP) + p * (PH + GAP);
      ax = cat.x + 52; ay = cat.y;
    } else { // top — three pills in a row above the node
      px = cat.x - PW * 1.5 - 18 + p * (PW + 18);
      py = cat.y - 60 - PH - 8;
      ax = cat.x; ay = cat.y - 52;
    }

    // glowing connector (gentle quadratic curve)
    const tx = cat.side === "left" ? px + PW : cat.side === "right" ? px : px + PW / 2;
    const ty = cat.side === "top" ? py + PH : py + PH / 2;
    const qx = (ax + tx) / 2, qy = (ay + ty) / 2 + (cat.side === "top" ? 0 : (p - 1) * 6);
    el("path", { class: "pill-link", d: `M ${ax} ${ay} Q ${qx} ${qy}, ${tx} ${ty}`,
      fill: "none", stroke: cat.color, "stroke-width": 1, opacity: 0.45 }, nodesLayer);

    // the pill itself
    const pill = el("g", { class: "pill pill-float" }, nodesLayer);
    pill.style.animationDelay = (i * 0.4 + p * 0.7) + "s";
    el("rect", { x: px, y: py, width: PW, height: PH, rx: PH / 2,
      fill: "rgba(10,13,34,0.85)", stroke: cat.color, "stroke-width": 1,
      filter: "url(#glow)", opacity: 0.95 }, pill);
    const icon = el("text", { x: px + 24, y: py + 29, "text-anchor": "middle", "font-size": 15 }, pill);
    icon.textContent = proj[0];
    const nameT = el("text", { x: px + 44, y: py + 20, fill: "#f2f5ff",
      "font-family": "Rajdhani, sans-serif", "font-size": 13, "font-weight": 700,
      "letter-spacing": 0.5 }, pill);
    nameT.textContent = proj[1];
    const subT = el("text", { x: px + 44, y: py + 35, fill: "#8b93b8",
      "font-family": "Rajdhani, sans-serif", "font-size": 10.5, "letter-spacing": 0.4 }, pill);
    subT.textContent = proj[2];
  });
});

/* ================================================================
   PART E — THE BRAIN + CORE NODE (drawn last so they sit on top)
   ================================================================ */
const brain = el("g", { class: "brain-body", transform: `translate(${CORE.x}, ${CORE.y})` });

// lobed brain silhouette (local coordinates around 0,0)
el("path", {
  d: `M -160 30 C -195 5, -195 -45, -155 -70
      C -160 -110, -110 -140, -70 -125
      C -45 -160, 15 -165, 45 -130
      C 95 -145, 140 -110, 130 -70
      C 170 -50, 172 5, 135 30
      C 140 70, 95 100, 55 85

      C -105 105, -150 75, -160 30 Z`,

  "stroke-width": 2.5, filter: "url(#glow-big)", opacity: 0.96 }, brain);

// central fissure
el("path", { d: "M -2 -150 C -14 -105, 12 -65, -6 -25 C -18 15, 10 55, 0 96",

// inner synapse squiggles with flowing energy
[
  "M -130 -20 C -100 -55, -60 -35, -40 -70 C -25 -95, 5 -90, 20 -110",
  "M 120 -25 C 90 -55, 55 -30, 35 -65 C 22 -88, -5 -80, -15 -105",

});

// tiny neuron dots inside the brain
[[-110,-40],[-60,-90],[10,-120],[75,-85],[115,-35],[95,45],[35,80],[-45,85],[-100,55],[-20,-30],[45,-20]]
  .forEach(([x, y], k) => {
    const dot = el("circle", { cx: x, cy: y, r: 2.4, fill: k % 2 ? "#9ef1ff" : "#c9b4ff",
      filter: "url(#glow)", class: "halo" }, brain);
    dot.style.animationDelay = (k * 0.3) + "s";
  });

// insert orbits UNDER the brain but keep both above branches
svg.insertBefore(orbits, brain);

// --- glowing core node "OBILIQ AI" in front of the brain ---
const coreG = el("g");
el("circle", { class: "core-glow", cx: CORE.x, cy: CORE.y, r: 78,
  fill: "#4de1ff", "fill-opacity": 0.22, filter: "url(#glow-big)" }, coreG);
el("circle", { cx: CORE.x, cy: CORE.y, r: 58, fill: "url(#core-fill)",
  filter: "url(#glow-big)" }, coreG);
el("circle", { cx: CORE.x, cy: CORE.y, r: 58, fill: "none",
  stroke: "rgba(255,255,255,0.75)", "stroke-width": 1.2 }, coreG);
el("circle", { cx: CORE.x, cy: CORE.y, r: 66, fill: "none",
  stroke: "#9ef1ff", "stroke-width": 0.8, "stroke-dasharray": "3 7", class: "orbit-ring" }, coreG);
const coreT1 = el("text", { x: CORE.x, y: CORE.y - 2, "text-anchor": "middle", fill: "#06121f",
  "font-family": "Orbitron, sans-serif", "font-size": 15, "font-weight": 900, "letter-spacing": 2 }, coreG);
coreT1.textContent = "OBILIQ";
const coreT2 = el("text", { x: CORE.x, y: CORE.y + 17, "text-anchor": "middle", fill: "#06121f",
  "font-family": "Orbitron, sans-serif", "font-size": 13, "font-weight": 700, "letter-spacing": 4 }, coreG);
coreT2.textContent = "AI";

/* ================================================================
   PART F — CANVAS: stars, drifting particles, faint neural mesh
   ================================================================ */
const canvas = document.getElementById("space");
const ctx = canvas.getContext("2d");
let W, H, stars = [], motes = [];

function resize() {
  W = canvas.width  = innerWidth  * devicePixelRatio;
  H = canvas.height = innerHeight * devicePixelRatio;
  canvas.style.width = innerWidth + "px";
  canvas.style.height = innerHeight + "px";

  // twinkling stars — regenerated on resize for even coverage
  stars = Array.from({ length: 170 }, () => ({
    x: Math.random() * W, y: Math.random() * H,
    r: (Math.random() * 1.1 + 0.3) * devicePixelRatio,
    tw: Math.random() * Math.PI * 2,            // twinkle phase
    sp: Math.random() * 1.5 + 0.4,              // twinkle speed
  }));

  // slow drifting glow motes — these also form the faint mesh
  motes = Array.from({ length: 46 }, () => ({
    x: Math.random() * W, y: Math.random() * H,
    vx: (Math.random() - 0.5) * 0.18 * devicePixelRatio,
    vy: (Math.random() - 0.5) * 0.18 * devicePixelRatio,
    r: (Math.random() * 1.6 + 0.8) * devicePixelRatio,
    hue: Math.random() < 0.5 ? "77, 225, 255" : "160, 120, 255",
  }));
}
resize();
addEventListener("resize", resize);

function frame(t) {
  ctx.clearRect(0, 0, W, H);

  // stars (sinusoidal twinkle)
  for (const s of stars) {
    const a = 0.35 + 0.55 * Math.abs(Math.sin(t / 1000 * s.sp + s.tw));
    ctx.globalAlpha = a;
    ctx.fillStyle = "#dfe8ff";
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
    ctx.fill();
  }

  // faint neural mesh: connect motes that drift near each other
  const linkDist = 150 * devicePixelRatio;
  for (let i = 0; i < motes.length; i++) {
    const a = motes[i];
    for (let j = i + 1; j < motes.length; j++) {
      const b = motes[j];
      const dd = Math.hypot(a.x - b.x, a.y - b.y);
      if (dd < linkDist) {
        ctx.globalAlpha = (1 - dd / linkDist) * 0.12;
        ctx.strokeStyle = "#7f9bff";
        ctx.lineWidth = devicePixelRatio * 0.6;
        ctx.beginPath();
        ctx.moveTo(a.x, a.y);
        ctx.lineTo(b.x, b.y);
        ctx.stroke();
      }
    }
  }

  // glowing motes
  for (const m of motes) {
    m.x = (m.x + m.vx + W) % W;
    m.y = (m.y + m.vy + H) % H;
    ctx.globalAlpha = 0.8;
    const g = ctx.createRadialGradient(m.x, m.y, 0, m.x, m.y, m.r * 5);
    g.addColorStop(0, `rgba(${m.hue}, 0.9)`);
    g.addColorStop(1, `rgba(${m.hue}, 0)`);
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(m.x, m.y, m.r * 5, 0, Math.PI * 2);
    ctx.fill();
  }

  ctx.globalAlpha = 1;
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

/* ================================================================
   PART G — MOUSE PARALLAX
   Background drifts opposite to the cursor; the neural map
   drifts slightly toward it, creating layered depth.
   ================================================================ */
addEventListener("mousemove", (e) => {
  const mx = (e.clientX / innerWidth  - 0.5);
  const my = (e.clientY / innerHeight - 0.5);
  canvas.style.transform = `translate(${mx * -14}px, ${my * -10}px)`;
  svg.style.transform    = `translate(${mx *  10}px, ${my *   8}px)`;
});
</script>
