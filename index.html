<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#120F17" />

    <title>Daksh Sinhghal — Student Innovator &amp; Creative Developer</title>
    <meta
      name="description"
      content="First-year B.Tech student building AI prototypes, gesture and motion interfaces, browser-based tools, simulations and product websites."
    />

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/favicon.svg" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap"
    />

    <!--
      Painted before React mounts so a hard refresh never flashes the wrong
      theme. Falls back to the dark-first default if storage is unavailable.
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('ds-theme');
          var theme =
            stored ||
            (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
          document.documentElement.classList.toggle('dark', theme === 'dark');
          document.documentElement.style.colorScheme = theme;
        } catch (e) {
          /* dark-first default already on <html> */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <div style="padding: 2rem; font: 16px/1.6 system-ui, sans-serif; color: #f8f7fc">
        <h1>Daksh Sinhghal</h1>
        <p>
          This portfolio needs JavaScript. The complete project archive remains browsable directly
          at <a href="/p/" style="color: #a855f7">/p/</a> and <a href="/s/" style="color: #a855f7">/s/</a>.
        </p>
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>

    <!--
      Botpress webchat. Loaded last so it never delays the hero paint, and kept
      here rather than inside a React component so a route change cannot mount a
      second copy of the widget.

      This only covers the portfolio SPA. The archived builds under /p/ and /s/
      are standalone HTML files that do not include this file, so the widget
      deliberately does not appear over them.
    -->
    <!--
      Both scripts are deferred. inject.js is ~1.7 MB — larger than the whole
      app bundle — so leaving it render-blocking delayed the load event and
      competed with the app's own chunks for bandwidth. Deferred scripts still
      run in document order, so inject.js is still guaranteed to execute before
      the configuration script that depends on it.
    -->
    <script src="https://cdn.botpress.cloud/webchat/v5.0/inject.js" defer></script>
    <script src="https://files.bpcontent.cloud/2026/10/01/06/20261001062153-B3H69HX8.js" defer></script>
  </body>
</html>
